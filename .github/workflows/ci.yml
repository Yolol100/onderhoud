name: Codecontrole (geen SSH)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python syntax, tests, example validation
        run: |
          python3 -m py_compile scripts/hostinger.py tests/test_hostinger.py
          python3 -m unittest discover -s tests -v
          python3 scripts/hostinger.py validate --config config/sites.example.json
