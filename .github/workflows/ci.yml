name: Codecontrole (geen SSH)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Python, Bash syntax en alle unit tests
        run: |
          python3 -m py_compile scripts/hostinger.py scripts/wordpress_maintenance.py scripts/hostinger_script_migration.py tests/test_hostinger.py tests/test_wordpress_maintenance.py tests/test_hostinger_script_migration.py
          bash -n scripts/wordpress_maintenance_remote.sh
          python3 -m unittest discover -s tests -v
          python3 scripts/hostinger.py validate --config config/sites.example.json
