name: Hostinger SSH - handmatig

on:
  workflow_dispatch:
    inputs:
      hosting:
        description: 'Kies hostingpakket; elk heeft eigen Environment secrets'
        required: true
        default: hostinger-1
        type: choice
        options: [hostinger-1, hostinger-2, hostinger-3, hostinger-4, hostinger-5, hostinger-6, hostinger-7, hostinger-8, hostinger-9, hostinger-10]
      site:
        description: 'Leeg voor hosting-check of lijst; ID alleen voor preview/deploy'
        required: false
        default: ''
        type: string
      mode:
        description: 'connect / list = hele hostingaccount; preview / deploy = per site'
        required: true
        default: connect
        type: choice
        options: [connect, list, preview, deploy]
      confirm:
        description: 'Alleen bij deploy exact DEPLOY:<site-ID> typen'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-ssh-operations
  cancel-in-progress: false

jobs:
  hostinger:
    name: Gekozen hostingpakket controleren of gerichte site-deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ inputs.hosting }}
    steps:
      - name: Checkout van main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Valideer code voor je SSH gebruikt
        run: |
          python3 -m py_compile scripts/hostinger.py
          python3 -m unittest discover -s tests -v
          python3 scripts/hostinger.py validate --config config/sites.example.json
      - name: SSH / simulatie / gecontroleerde upload
        env:
          HOSTINGER_SITES_JSON: ${{ secrets.HOSTINGER_SITES_JSON }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          SITE_ID: ${{ inputs.site }}
          HOSTING_ENV: ${{ inputs.hosting }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hostinger.py "$MODE" --site "$SITE_ID" --confirm "$CONFIRM"
